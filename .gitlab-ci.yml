# PLANT-COMMONS: ALTERNATIVE B of two CI skeletons (the other is
# /.github/workflows/plant-commons-images.yml). Keep the one for the platform that hosts the
# repo and delete the other.
# All logic lives in deploy/build-images.sh; this file only sets up docker, logs in and calls it.
# Documentation: docs/plant-commons/images.md
#
# CI/CD variables (names only, see docs/plant-commons/images.md). Project or group variables
# override the defaults below. Mark REGISTRY_PASSWORD as masked + protected.
#   IMAGE_REGISTRY, IMAGE_NAMESPACE, REGISTRY_USER, REGISTRY_PASSWORD, IMAGE_BUILD_ARGS (optional)
# The defaults target GitLab's own container registry; replace them if images go elsewhere.

stages:
  - build
  # - chart # PLANT-COMMONS, Phase 5: enable together with the commented chart job below

variables:
  IMAGE_REGISTRY: $CI_REGISTRY
  IMAGE_NAMESPACE: $CI_PROJECT_PATH # lower-cased by the script
  REGISTRY_USER: $CI_REGISTRY_USER
  REGISTRY_PASSWORD: $CI_REGISTRY_PASSWORD
  IMAGE_BUILD_ARGS: "" # e.g. "--all" to include scrapers and codemeta
  DOCKER_TLS_CERTDIR: "/certs"

# Hidden job: docker-in-docker with a docker-container buildx builder (needed for the
# registry layer cache). The official docker CLI image ships the buildx plugin; confirm with
# `docker buildx version` in the first run.
.images:
  stage: build
  image: docker:28-cli
  services:
    - docker:28-dind
  timeout: 60 minutes
  before_script:
    - apk add --no-cache bash git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - docker buildx create --name plant-commons --driver docker-container --use
  variables:
    IMAGE_SOURCE: $CI_PROJECT_URL
    IMAGES_FILE: images.txt
    # Pushes write the cache, merge requests only read it.
    BUILD_CACHE_FROM: type=registry,ref=$IMAGE_REGISTRY/$CI_PROJECT_PATH/plant-commons-{service}:buildcache

# Merge requests: build only.
images:build:
  extends: .images
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - ./deploy/build-images.sh $IMAGE_BUILD_ARGS

# Default branch and tags: build and push. The script reads CI_COMMIT_TAG for the release tag.
images:publish:
  extends: .images
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    BUILD_CACHE_TO: type=registry,ref=$IMAGE_REGISTRY/$CI_PROJECT_PATH/plant-commons-{service}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
  script:
    - echo "$REGISTRY_PASSWORD" | docker login --username "$REGISTRY_USER" --password-stdin "$IMAGE_REGISTRY"
    - ./deploy/build-images.sh --push $IMAGE_BUILD_ARGS
  artifacts:
    paths: [images.txt]
    expire_in: 30 days

