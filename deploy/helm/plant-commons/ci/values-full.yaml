# PLANT-COMMONS: every optional part switched on with placeholder inputs (chart-internal database), only to render and
# lint all templates in CI (together with values-ci.yaml). The external database is values-external.yaml. Obviously fake; never deploy with this file.
scrapers:
  enabled: true
swagger:
  enabled: true
dbMigration:
  enabled: true
  configMapName: example-migration
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: example-ingress-namespace}}
  egress:
    enabled: true
routing:
  enabled: true
  entryPoints: [example-entrypoint]
  certificate:
    issuerRef: {name: example-issuer}
