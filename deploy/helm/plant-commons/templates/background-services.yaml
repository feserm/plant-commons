{{- $c := "background-services" }}
{{- $v := .Values.backgroundServices }}
{{- $cfg := include "pc.config.backgroundServices" . | fromYaml }}
{{- $env := dict }}
{{- if $v.javaToolOptions }}{{- $_ := set $env "JAVA_TOOL_OPTIONS" $v.javaToolOptions }}{{- end }}
{{- /* Exactly one replica, Recreate (never two refreshers), no Service, no ports, so no HTTP probes. It starts
       fine while the database is down (measured: first job runs after a 30 s delay), so no init container. */}}
{{- $spec := dict "ctx" . "c" $c "v" $v "image" (include "pc.image" (dict "ctx" . "c" $c))
  "args" $v.args
  "checksum" (include "pc.configChecksum" (dict "data" $cfg))
  "envBlock" (include "pc.env" (dict "ctx" . "c" $c "config" true "secrets" (list "POSTGRES_PASSWORD") "env" $env))
  "emptyDirs" (list "/tmp") "replicas" 1 "strategy" (dict "type" "Recreate") }}
{{ include "pc.configmap" (dict "ctx" . "c" $c "data" $cfg) }}
---
{{ include "pc.deployment" $spec }}
