{{- /*
STUB, UNTESTED, OFF (dbMigration.enabled=false). There is no migration runner upstream: the schema is only
created once (first start of the chart's own database, or deploy/postgres/init.sql on the external one). For an
upgrade you supply upstream's migration SQL for the release in a ConfigMap and run it through psql as the
database OWNER (external database) or the chart's superuser (database.enabled=true). Read README.md
("Database upgrades") first. Not run in any cluster; the psql invocation was only checked against the
rsd/database image locally.
PLANT-COMMONS: with database.enabled=false the Job connects to externalDatabase with the owner credentials
(externalDatabase.ownerSecret) over TLS (PGSSLMODE=verify-full, PGSSLROOTCERT = the mounted CA, the same Secret
as the backend's).
*/ -}}
{{- if .Values.dbMigration.enabled }}
{{- $c := "db-migration" }}
{{- $v := dict "podSecurityContext" .Values.database.podSecurityContext "securityContext" .Values.database.securityContext "resources" .Values.dbMigration.resources }}
{{- /* libpq wants the password as PGPASSWORD; the other owner variables (user name) are kept as they are */}}
{{- $refs := list }}
{{- range include "pc.db.ownerRefs" . | fromYamlArray }}
{{- $refs = append $refs (ternary (dict "name" "PGPASSWORD" "secret" .secret "key" .key) . (eq .name "POSTGRES_PASSWORD")) }}
{{- end }}
{{- $env := dict "PGCONNECT_TIMEOUT" "10" }}
{{- if not .Values.database.enabled }}
{{- $_ := set $env "PGSSLMODE" .Values.externalDatabase.sslMode }}
{{- $_ := set $env "PGSSLROOTCERT" (include "pc.db.caFile" .) }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pc.name" (dict "ctx" . "c" $c) }}-{{ .Values.dbMigration.name }}
  labels:
    {{- include "pc.labels" (dict "ctx" . "c" $c) | nindent 4 }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        {{- include "pc.selectorLabels" (dict "ctx" . "c" $c) | nindent 8 }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
      containers:
        - name: psql
          image: {{ include "pc.image" (dict "ctx" . "c" "database") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Exec-form args for the image's docker-entrypoint.sh (it execs anything that is not `postgres`).
          # ON_ERROR_STOP + single transaction: a failing migration leaves the database unchanged.
          # $(VAR) is expanded by Kubernetes from the env below. The ConfigMap of background-services holds
          # POSTGRES_DB_HOST/_PORT/POSTGRES_DB (and POSTGRES_USER unless it comes from the owner Secret), so it is
          # reused here; the owner credentials and the libpq TLS variables are added below.
          args:
            - psql
            - --set=ON_ERROR_STOP=1
            - --single-transaction
            - --host=$(POSTGRES_DB_HOST)
            - --port=$(POSTGRES_DB_HOST_PORT)
            - --username=$(POSTGRES_USER)
            - --dbname=$(POSTGRES_DB)
            - --file=/migration/migration.sql
          {{- include "pc.env" (dict "ctx" . "c" "background-services" "config" true "secretRefs" $refs "env" $env) | nindent 10 }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          securityContext:
            {{- toYaml $v.securityContext | nindent 12 }}
          volumeMounts:
            - name: migration
              mountPath: /migration
              readOnly: true
            {{- with include "pc.db.caVolumeMounts" . }}
            {{- . | nindent 12 }}
            {{- end }}
      volumes:
        - name: migration
          configMap:
            name: {{ .Values.dbMigration.configMapName | quote }}
            items:
              - key: {{ .Values.dbMigration.configMapKey | quote }}
                path: migration.sql
        {{- with include "pc.db.caVolumes" . }}
        {{- . | nindent 8 }}
        {{- end }}
{{- end }}
