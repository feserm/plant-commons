{{- /* LOCAL TESTS ONLY (secrets.create=true). The real deployment references an existing Secret. */ -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pc.secretName" . }}
  labels:
    {{- include "pc.labels" (dict "ctx" . "c" "secrets") | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets.values }}
  {{- /* PLANT-COMMONS: the database passwords belong to the external database's own Secrets */}}
  {{- if or $.Values.database.enabled (not (has $k (list "POSTGRES_PASSWORD" "POSTGRES_AUTHENTICATOR_PASSWORD"))) }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
{{- end }}
