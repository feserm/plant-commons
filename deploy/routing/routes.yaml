# PLANT-COMMONS: route table for the platform's service registry (machine-readable; the platform takes this file unchanged).
# Derived from docs/plant-commons/routing.md (nginx.conf of RSD v6.7.4). The chart renders no Ingress/IngressRoute/
# Middleware/Certificate (routing.enabled=false); host, routes and the certificate are generated by the platform from this.
#
# Longest matching path prefix wins (as in nginx and Traefik PathPrefix). All prefixes carry the trailing slash.
# Fields per route:
#   path                  path prefix
#   service, port         Service name (fixed, independent of the release name) and port in the release namespace;
#                         ci/check.sh compares them with the rendered Services
#   stripPrefix           removed from the path before it reaches the service (query string kept); absent = path kept
#   maxRequestBodyBytes   request body limit (nginx: 40M on /api/v1 and /api/v2, default 1M elsewhere); absent = platform default
#   requestHeaders        request headers SET (replaced, not appended) before the request reaches the service
#   compress              gzip response compression (nginx compressed text/css, application/javascript, image/svg+xml, text/html)
#
# Not listed because the component is not deployed: /metadata/codemeta/ (codemeta), /swagger/ (swagger, optional in the chart),
# /documentation/ (documentation; the UI's links to it 404, implementation.md open question 17).
# /api/v2/ is served by auth and only exists with auth.apiAccessTokenEnabled=true (the chart default).
host: plant-commons.ipk-gatersleben.de
routes:
  # ORCID redirect URIs /auth/login/orcid and /auth/couple/orcid live here: must be reachable from browsers
  - {path: /auth/, service: auth, port: 7000}
  # PostgREST, browser API
  - {path: /api/v1/, service: backend, port: 3500, stripPrefix: /api/v1, maxRequestBodyBytes: 41943040}
  # personal-access-token API, proxied by auth to PostgREST
  - {path: /api/v2/, service: auth, port: 7000, maxRequestBodyBytes: 41943040}
  # images: get_image returns application/octet-stream, nginx forced the Accept header, keep that
  - {path: /image/, service: backend, port: 3500, stripPrefix: /image, requestHeaders: {Accept: application/octet-stream}}
  # everything else (Next.js, including its own /api/fe/... routes)
  - {path: /, service: frontend, port: 3000, compress: true}
